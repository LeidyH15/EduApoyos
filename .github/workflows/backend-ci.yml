name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Mostrar version de .NET
        run: dotnet --version

      - name: Restaurar dependencias
        run: dotnet restore EduApoyos.sln

      - name: Compilar en Release
        run: >
          dotnet build EduApoyos.sln
          --configuration Release
          --no-restore

      - name: Ejecutar pruebas
        env:
          Jwt__Key: IntegrationTests_CI_Jwt_Key_2026_Segura_123456789
          Jwt__Issuer: EduApoyos.Api.Tests
          Jwt__Audience: EduApoyos.Client.Tests
          Jwt__ExpirationMinutes: 60
        run: >
          dotnet test EduApoyos.sln
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --results-directory TestResults

      - name: Publicar API
        run: >
          dotnet publish
          src/EduApoyos.Api/EduApoyos.Api.csproj
          --configuration Release
          --no-restore
          --output artifacts/api

      - name: Cargar artefacto de la API
        uses: actions/upload-artifact@v7
        with:
          name: eduapoyos-api
          path: artifacts/api
          if-no-files-found: error
          retention-days: 7